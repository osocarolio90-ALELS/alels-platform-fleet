server.port=${ALELS_BACKEND_PORT:8080}

spring.application.name=alels-backend

spring.datasource.url=${ALELS_DB_URL:jdbc:postgresql://localhost:5432/alels_db}
spring.datasource.username=${ALELS_DB_USER:alels}
spring.datasource.password=${ALELS_DB_PASSWORD:123456}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${ALELS_DB_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=${ALELS_DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${ALELS_DB_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.idle-timeout=${ALELS_DB_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${ALELS_DB_MAX_LIFETIME_MS:1800000}

alels.jwt.secret=${ALELS_JWT_SECRET:CHANGE_THIS_TO_LONG_SECRET_KEY_MINIMUM_32_CHARS}
alels.jwt.expiration-ms=${ALELS_JWT_EXPIRATION_MS:86400000}
alels.bootstrap.root-password=${ALELS_ROOT_INITIAL_PASSWORD:Alels@2026!}


# CORS is environment-driven: no Java code change is needed when moving from local LAN to VPS/cloud.
# Development default supports localhost and private LAN frontends.
# Production should override with exact HTTPS domains, for example:
# ALELS_CORS_ALLOWED_ORIGINS=https://app.alels.id,https://admin.alels.id
# ALELS_CORS_ALLOWED_ORIGIN_PATTERNS=
alels.cors.allowed-origins=${ALELS_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
alels.cors.allowed-origin-patterns=${ALELS_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:[*],http://127.0.0.1:[*],http://192.168.*.*:[*],http://10.*.*.*:[*],http://172.16.*.*:[*],http://172.17.*.*:[*],http://172.18.*.*:[*],http://172.19.*.*:[*],http://172.20.*.*:[*],http://172.21.*.*:[*],http://172.22.*.*:[*],http://172.23.*.*:[*],http://172.24.*.*:[*],http://172.25.*.*:[*],http://172.26.*.*:[*],http://172.27.*.*:[*],http://172.28.*.*:[*],http://172.29.*.*:[*],http://172.30.*.*:[*],http://172.31.*.*:[*]}
