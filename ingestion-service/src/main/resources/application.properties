kafka.bootstrap.servers=localhost:9092
kafka.topic.telemetry.raw=telemetry.raw
kafka.topic.telemetry.dlq=telemetry.dead-letter
kafka.consumer.group.id=alels-ingestion-service
kafka.consumer.poll.ms=1000
kafka.consumer.max.poll.records=500
ingestion.max.retries=3
ingestion.retry.backoff.ms=250
ingestion.lag.snapshot.interval.ms=30000

# Database credentials are required through ALELS_DB_URL/ALELS_DB_USER/ALELS_DB_PASSWORD.
database.pool.maximumSize=20

ingestion.dlq.replay.max.records=1000
ingestion.dlq.replay.on.startup=false
