apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: alels-gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: alels-gateway
  minReplicas: 2
  maxReplicas: 100
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 900
      policies:
        - type: Percent
          value: 10
          periodSeconds: 300
  metrics:
    - type: External
      external:
        metric:
          name: alels_gateway_connections_active_per_pod
        target:
          type: AverageValue
          averageValue: "70000"
