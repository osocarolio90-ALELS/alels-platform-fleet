apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: alels-ingestion
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: alels-ingestion
  minReplicas: 2
  maxReplicas: 100
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
        - type: Pods
          value: 1
          periodSeconds: 300
  metrics:
    - type: External
      external:
        metric:
          name: alels_ingestion_consumer_lag_per_pod
        target:
          type: AverageValue
          averageValue: "10000"
