global
    log stdout format raw local0
    maxconn 250000

defaults
    log global
    mode tcp
    option dontlognull
    timeout connect 5s
    timeout client 4m
    timeout server 4m

frontend alels_gateway_tcp
    bind :5050
    default_backend alels_gateway_nodes

backend alels_gateway_nodes
    balance leastconn
    option tcp-check
    tcp-check connect port 9090
    tcp-check send "GET\ /ready\ HTTP/1.1\r\nHost:\ gateway\r\nConnection:\ close\r\n\r\n"
    tcp-check expect rstring "HTTP/1\\.[01]\ 200"
    server gateway-1 gateway-1.internal:5050 check port 9090 inter 2s fall 3 rise 2
    server gateway-2 gateway-2.internal:5050 check port 9090 inter 2s fall 3 rise 2

frontend alels_backend_http
    bind :8080
    mode http
    default_backend alels_backend_nodes

backend alels_backend_nodes
    mode http
    balance leastconn
    option httpchk GET /actuator/health
    http-check expect status 200
    server backend-1 backend-1.internal:8080 check inter 2s fall 3 rise 2
    server backend-2 backend-2.internal:8080 check inter 2s fall 3 rise 2
