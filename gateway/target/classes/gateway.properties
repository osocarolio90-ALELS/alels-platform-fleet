gateway.port=5050
gateway.idleTimeoutSeconds=180
database.url=jdbc:postgresql://localhost:5432/alels_db
database.user=alels
database.password=change_me

# Production-scale default: gateway publishes telemetry to Kafka/Redpanda.
# Use TELEMETRY_PUBLISHER_MODE=direct only for local debugging, not for scale tests.
telemetry.publisher.mode=kafka
kafka.bootstrap.servers=localhost:9092
kafka.topic.telemetry.raw=telemetry.raw
